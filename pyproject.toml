[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "const-ellation"
version = "0.7.0"
description = "Astronomical inference, orbit searches, stellar tracebacks, and Gaussian detection bounds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "astropy>=6,<9", "jsonschema>=4.21,<5"]

[project.urls]
Repository = "https://github.com/WoshuaJolk/constellation"
Documentation = "https://github.com/WoshuaJolk/constellation/blob/main/README.md"
Issues = "https://github.com/WoshuaJolk/constellation/issues"

[project.optional-dependencies]
agent = []  # Compatibility extra; schema support is now included in the base install.
test = ["pytest>=8,<10"]
ephemeris = ["jplephem>=2.22,<3"]
research = ["finufft>=2.4,<3", "python-flint>=0.8,<0.9", "mpmath>=1.3,<2"]
accelerate = ["numba>=0.60,<1"]
itf = ["numba>=0.60,<1", "jplephem>=2.22,<3", "ijson>=3.3,<4"]

[project.scripts]
solve_itf = "magictools.itf.dispatch:main"
magictools = "magictools.cli:main"
constellation = "magictools.agent_cli:main"
magictools-fold-chart = "research.kepler_transform.chart_search:main"
magictools-fit-sky = "research.fit_sky.cli:main"
magictools-fit-sky-stream = "research.fit_sky.sequential_cli:main"

[tool.setuptools.package-dir]
"" = "src"
"research.kepler_transform" = "research/kepler_transform"
"research.detection_limit" = "research/detection_limit"
"research.fit_sky" = "research/fit_sky"

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
    "magictools*",
    "research.kepler_transform",
    "research.kepler_transform.temporal",
    "research.kepler_transform.timing",
    "research.kepler_transform.ordered",
    "research.kepler_transform.detector_time",
    "research.detection_limit",
    "research.fit_sky",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
