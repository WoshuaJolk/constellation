[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magictools-astro"
version = "0.3.0"
description = "Astronomical inference, orbit searches, stellar tracebacks, and Gaussian detection bounds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "astropy>=6,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ephemeris = ["jplephem>=2.22,<3"]

[project.scripts]
magictools = "magictools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
