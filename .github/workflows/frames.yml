name: archive frames
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: frames-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frames:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/test_frames.py tests/test_frames_expanded.py tests/test_cli.py tests/test_ztf.py -q
      - run: magictools frames capabilities
      - run: magictools frames search examples/frames/ephemeris.json --run-dir runs/plan --plan
